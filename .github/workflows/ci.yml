name: CI
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install privacy validation dependencies
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0 pypdf==6.1.1 reportlab==4.4.9
      - name: Validate repository structure
        shell: pwsh
        run: ./scripts/validate_repo.ps1
      - name: Build and validate public-site boundary
        shell: pwsh
        run: ./scripts/build_public_site.ps1
